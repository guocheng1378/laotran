name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 写入大模型 API Key（来自 Secrets）
        shell: bash
        run: |
          if [ -n "${{ secrets.API_KEY }}" ]; then
            echo "API_KEY=${{ secrets.API_KEY }}" > local.properties
            echo "已写入 API Key 到 local.properties"
          else
            echo "API_KEY=" > local.properties
            echo "警告：未设置 Secrets.API_KEY，运行时可翻译但需配置 key"
          fi

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: laotran-debug-apk
          path: app/build/outputs/apk/debug/*.apk
