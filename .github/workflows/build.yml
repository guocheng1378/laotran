name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: 写入大模型 API Key（来自 Secrets）
        shell: bash
        run: |
          if [ -n "${{ secrets.API_KEY }}" ]; then
            echo "API_KEY=${{ secrets.API_KEY }}" > local.properties
            echo "已写入 API Key 到 local.properties"
          else
            echo "API_KEY=" > local.properties
            echo "警告：未设置 Secrets.API_KEY，运行时可翻译但需配置 key"
          fi

      - name: 还原固定签名密钥（来自 Secret KEYSTORE_P12）
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_P12 }}" ]; then
            echo "${{ secrets.KEYSTORE_P12 }}" | base64 -d > laotran.keystore
            echo "已还原固定签名密钥 laotran.keystore"
          else
            echo "警告：未设置 Secrets.KEYSTORE_P12，将使用默认 debug 签名（覆盖更新会失败）"
          fi

      - name: 编译 Release APK（固定签名）
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8
          name: LaoTran v1.8
          body: |
            自动构建发布版（固定签名，支持应用内覆盖更新）。
            含免费翻译引擎 MyMemory、音频持久化、历史记录、4-tab UI。
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
