name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: 写入大模型 API Key
        shell: bash
        run: |
          if [ -n "${{ secrets.API_KEY }}" ]; then
            echo "API_KEY=${{ secrets.API_KEY }}" > local.properties
          else
            echo "API_KEY=" > local.properties
          fi
      - name: 还原固定签名密钥
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_P12 }}" ]; then
            echo "${{ secrets.KEYSTORE_P12 }}" | base64 -d > laotran.keystore
          else
            echo "警告：未设置 KEYSTORE_P12"
          fi
      - name: 编译 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: 读取版本号并检查 tag 是否已发布
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/git/refs/tags/v$VER")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 发布到 GitHub Release
        if: steps.rel.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.ver }}
          name: LaoTran v${{ steps.rel.outputs.ver }}
          body: |
            自动构建发布版（固定签名，支持应用内覆盖更新）。
            含免费翻译引擎 MyMemory、音频持久化、历史记录、4-tab UI、应用内自动更新检测。
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
